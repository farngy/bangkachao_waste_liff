<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 หน้าต่างทดสอบระบบส่งข้อมูลด่วน</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .test-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .btn-danger-test {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(229, 62, 62, 0.4);
            width: 100%;
            margin-top: 20px;
        }
        .btn-danger-test:active {
            transform: scale(0.95);
            background-color: #c53030;
        }
        #statusMessage {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #4a5568;
        }
    </style>
</head>
<body>

<div class="test-box">
    <h2>🧪 สเต็ปทดสอบท่อส่ง</h2>
    <p style="color: #718096;">กดปุ่มสีแดงด้านล่าง เพื่อทดลองส่งคำว่า "OK" วิ่งเข้าสู่ตารางสเปรดชีต</p>
    
    <button class="btn-danger-test" onclick="sendOkToGoogleSheet()">กดส่ง OK 🚀</button>
    
    <div id="statusMessage">สถานะ: รอการกดปุ่ม...</div>
</div>

<script>
    // พิกัดท่อส่ง Google Apps Script ตัวจริงของพี่แฟง
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzv3E2rOc66DikVe3k3ncR1AxFUbQYe3kcu-Q7PT-9ozOjR7aeX6hbcGhV3mVl5VGEJ/exec";

    function sendOkToGoogleSheet() {
        const msgDiv = document.getElementById('statusMessage');
        msgDiv.innerText = "⏳ กำลังยิงข้อมูลข้ามท่อ...";
        msgDiv.style.color = "#d69e2e";

        // ยิงข้อมูลทดสอบแบบดิบๆ ไม่ต้องพึ่งพาข้อมูลใดๆ ทั้งสิ้น
        const payload = new URLSearchParams();
        payload.append("action", "saveGarbage");
        payload.append("userId", "OK"); // บังคับเขียนลงคอลัมน์ A ว่า OK 

        fetch(SCRIPT_URL, {
            method: "POST",
            body: payload,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        })
        .then(res => {
            msgDiv.innerText = "✅ ส่งคำว่า OK สำเร็จแล้ว! พี่แฟงเปิดดูในชีตได้เลย!";
            msgDiv.style.color = "#38a169";
        })
        .catch(err => {
            msgDiv.innerText = "❌ เกิดข้อผิดพลาด: " + err.toString();
            msgDiv.style.color = "#e53e3e";
            console.error(err);
        });
    }
</script>

</body>
</html>
