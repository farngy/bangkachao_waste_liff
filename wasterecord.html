<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 สเต็ปที่ 1: เทสส่งรูปเข้ากูเกิลไดร์ฟ</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f7fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        }
        .btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 18px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 20px; 
            transition: background 0.2s;
        }
        .btn:active { 
            transform: scale(0.97); 
        }
        #result { 
            margin-top: 20px; 
            font-size: 15px; 
            font-weight: bold; 
            color: #4a5568; 
            word-break: break-all; 
            text-align: left; 
            background: #edf2f7; 
            padding: 12px; 
            border-radius: 10px; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🧪 เทสอัปโหลดรูปภาพเข้า Drive</h2>
    <p style="color: #718096; font-size: 14px; line-height: 1.5;">
        ระบบจะจำลองส่งรูปภาพสี่เหลี่ยมสีเขียวขนาดเล็ก ยิงตรงจาก GitHub ไปเซฟในโฟลเดอร์ Google Drive ของพี่แฟงเพื่อทดสอบระบบสิทธิ์โดยตรงจ้า
    </p>
    
    <button class="btn" onclick="testUploadImage()">🚀 สั่งยิงรูปภาพเข้าไดร์ฟ</button>
    
    <div id="result">กำลังเตรียมส่ง...</div>
</div>

        resDiv.style.color = "#dd6b20";
