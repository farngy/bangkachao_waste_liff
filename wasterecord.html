<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อมูลขยะ - บัญชีขยะดิจิทัล</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --primary-dark: #143F24; --primary-green: #1b4332; --bg-light: #F4F6F5; --text-main: #2d3748; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); background-color: #e9ecef; margin: 0; padding: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .phone-container { width: 100%; max-width: 450px; min-height: 100vh; background: #FFFFFF; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .top-bar { text-align: center; padding-bottom: 16px; border-bottom: 2px solid var(--bg-light); margin-bottom: 25px; }
        .brand-name { font-size: 22px; font-weight: 800; color: var(--primary-dark); }
        h2 { font-size: 26px; color: var(--primary-dark); margin: 0 0 10px 0; font-weight: 800; text-align: center; }
        .sub-title { font-size: 15px; color: #718096; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 17px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; }
        .form-input { width: 100%; box-sizing: border-box; padding: 16px; font-size: 20px; font-weight: 700; border: 2px solid #cbd5e0; border-radius: 14px; background-color: var(--bg-light); text-align: center; }
        .form-select { width: 100%; padding: 16px; font-size: 18px; font-weight: 600; border: 2px solid #cbd5e0; border-radius: 14px; background-color: var(--bg-light); color: var(--text-main); }
        .btn-submit { background-color: var(--primary-dark); color: white; border: none; width: 100%; padding: 18px; font-size: 20px; font-weight: 800; border-radius: 35px; cursor: pointer; box-shadow: 0 5px 15px rgba(20, 63, 36, 0.2); margin-top: 10px; }
        .hidden { display: none !important; }
        .success-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex-grow: 1; padding: 40px 10px; }
        .success-circle { width: 100px; height: 100px; background-color: #e6fffa; border: 4px solid #319795; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; }
        .success-icon { font-size: 50px; color: #319795; }
        .success-title { font-size: 26px; font-weight: 800; color: var(--primary-dark); margin-bottom: 12px; }
        .success-subtitle { font-size: 17px; color: #4a5568; margin-bottom: 35px; }
        .btn-line-close { background-color: #06C755; color: white; border: none; width: 100%; padding: 18px; font-size: 20px; font-weight: 800; border-radius: 35px; cursor: pointer; }
    </style>
</head>
<body>
<div class="phone-container">
    <div class="top-bar"><div class="brand-name">🌱 บัญชีขยะดิจิทัล</div></div>

    <div id="garbageFormContainer">
        <h2>บันทึกข้อมูลส่งขยะ</h2>
        <div class="sub-title">กรุณากรอกประเภทและน้ำหนักขยะรีไซเคิลที่ท่านนำมาส่งค่ะ</div>

        <form id="garbageForm" onsubmit="event.preventDefault(); submitGarbageData();">
            <div class="form-group">
                <label class="form-label" for="garbageType">♻️ ประเภทขยะรีไซเคิล</label>
                <select id="garbageType" class="form-select" required>
                    <option value="" disabled selected>--- โปรดเลือกประเภทขยะ ---</option>
                    <option value="ขวดพลาสติกใส (PET)">ขวดพลาสติกใส (PET)</option>
                    <option value="พลาสติกรวม/ขวดขุ่น (HDPE)">พลาสติกรวม / ขวดขุ่น (HDPE)</option>
                    <option value="กระดาษ/ลังกระดาษ">กระดาษ / ลังกระดาษ</option>
                    <option value="ขวดแก้ว/เศษแก้ว">ขวดแก้ว / เศษแก้ว</option>
                    <option value="กระป๋องอลูมิเนียม">กระป๋องอลูมิเนียม / โลหะรวม</option>
                </select>
            </div>
            <div class="form-group"><label class="form-label" for="weight">⚖️ น้ำหนักขยะ (กิโลกรัม)</label><input type="number" id="weight" class="form-input" step="0.1" min="0.1" placeholder="0.0" inputmode="decimal" required></div>
            <button type="submit" class="btn-submit" id="submitGarbageBtn">💾 บันทึกข้อมูลขยะ</button>
        </form>
    </div>

    <div id="garbageSuccessView" class="success-wrapper hidden">
        <div class="success-circle"><span class="success-icon">✓</span></div>
        <h3 class="success-title">บันทึกข้อมูลขยะสำเร็จ!</h3>
        <p class="success-subtitle" id="successGarbageMessage"></p>
        <button type="button" class="btn-line-close" onclick="closeLiffWindow()">💬 กลับเข้าแชท LINE</button>
    </div>
</div>

<script>
    // 🌟 ใส่รหัส LIFF ID ของหน้าบันทึกขยะตรงนี้ได้เลยครับพี่แฟง
    const LIFF_GARBAGE_ID = "ใส่_LIFF_ID_ของหน้าบันทึกขยะตรงนี้"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcEN_Dkv9EUfAIeCKHL7QxW61elqdimdCr7WJDtnb5hCVd4aeeA6y7gWgL7cUfKz_u/exec";
    let globalUserId = "MOCK_USER_ID";

    if (typeof liff !== 'undefined' && LIFF_GARBAGE_ID !== "") {
        liff.init({ liffId: LIFF_GARBAGE_ID }).then(async () => { 
            if (!liff.isLoggedIn()) { liff.login(); } else {
                const profile = await liff.getProfile();
                if(profile && profile.userId) { globalUserId = profile.userId; }
            }
        }).catch(err => console.error(err));
    }

    function closeLiffWindow() { if (typeof liff !== 'undefined') { liff.closeWindow(); } }

    function submitGarbageData() {
        const btn = document.getElementById('submitGarbageBtn');
        const garbageType = document.getElementById('garbageType').value;
        const weight = document.getElementById('weight').value;
        if (!garbageType || !weight) { return; }

        btn.innerText = "⏳ กำลังบันทึกข้อมูลขยะ..."; btn.disabled = true;
        const formParams = new URLSearchParams();
        formParams.append('action', 'saveGarbage');
        formParams.append('userId', globalUserId);
        formParams.append('garbageType', garbageType);
        formParams.append('weight', weight);

        fetch(SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formParams.toString()
        });

        setTimeout(() => {
            document.getElementById('garbageFormContainer').classList.add('hidden');
            document.getElementById('successGarbageMessage').innerHTML = `ระบบได้ทำการบันทึกข้อมูลการส่งขยะประเภท <strong>"${garbageType}"</strong> ปริมาณ <strong>${weight} กก.</strong> เรียบร้อยแล้วค่ะ ขอบคุณมากค่ะ`;
            document.getElementById('garbageSuccessView').classList.remove('hidden');
            if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                liff.sendMessages([{ type: 'text', text: `♻️ บันทึกส่งขยะสำเร็จ: ${garbageType} ปริมาณ ${weight} กิโลกรัม เรียบร้อยแล้วค่ะ!` }]).catch(e => console.log(e));
            }
        }, 1500);
    }
</script>
</body>
</html>
