<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อมูลขยะ - บัญชีขยะดิจิทัล</title>
    <!-- ดึงระบบ LINE LIFF SDK (เผื่อพี่เปิดใช้ระบบผ่านไลน์สไตล์เดียวกับหน้าลงทะเบียน) -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-dark: #143F24;     /* สีเขียวเข้มพรีเมียม */
            --primary-green: #2f855a;    /* สีเขียวบันทึกขยะ */
            --bg-light: #F4F6F5;         /* สีพื้นหลังขาวครีม */
            --text-main: #2d3748;        /* สีตัวหนังสือหลัก */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background: #FFFFFF;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .top-bar {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--bg-light);
            margin-bottom: 25px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        h2 {
            font-size: 26px;
            color: var(--primary-dark);
            margin: 0 0 10px 0;
            font-weight: 800;
            text-align: center;
        }
        .sub-title {
            font-size: 15px;
            color: #718096;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .form-input, .form-select {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            color: var(--text-main);
            background-color: var(--bg-light);
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary-dark);
            background-color: #FFFFFF;
        }

        .readonly-input {
            background-color: #e2e8f0;
            color: #4a5568;
            cursor: not-allowed;
        }

        .btn-submit {
            background-color: var(--primary-dark);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(20, 63, 36, 0.2);
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .btn-submit:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-report {
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="top-bar">
        <div class="brand-name">🌱 บัญชีขยะดิจิทัล</div>
    </div>

    <div id="formContainer">
        <h2>บันทึกข้อมูลขยะชุมชน</h2>
        <div class="sub-title">กรอกข้อมูลและถ่ายรูปขยะพลาสติก เพื่อคำนวณการลดคาร์บอนฟุตพริ้นท์ค่ะ</div>

        <form id="trashForm" onsubmit="event.preventDefault(); submitTrashData();">
            
            <!-- 1. คอลัมน์ A: LINE_User_ID -->
            <div class="form-group">
                <label class="form-label">🆔 LINE User ID</label>
                <input type="text" id="lineUserId" class="form-input readonly-input" readonly placeholder="กำลังดึงข้อมูล LINE ID...">
            </div>

            <!-- 2. คอลัมน์ C: ประเภทขยะหลัก -->
            <div class="form-group">
                <label class="form-label">📦 ประเภทขยะหลัก</label>
                <select id="mainType" class="form-select" required>
                    <option value="ขยะพลาสติก" selected>ขยะพลาสติก</option>
                    <option value="ขยะอินทรีย์">ขยะอินทรีย์</option>
                    <option value="ขยะรีไซเคิลอื่นๆ">ขยะรีไซเคิลอื่นๆ</option>
                </select>
            </div>

            <!-- 3. คอลัมน์ D: ประเภทขยะย่อย -->
            <div class="form-group">
                <label class="form-label">🔍 ประเภทขยะย่อย</label>
                <select id="subType" class="form-select" required onchange="calculateCarbon()">
                    <option value="" disabled selected>--- โปรดเลือกประเภทขยะย่อย ---</option>
                    <option value="ขวดพลาสติกใส (PET)">ขวดพลาสติกใส (PET)</option>
                    <option value="ถุงพลาสติก/ซองขนม (LDPE/PP)">ถุงพลาสติก/ซองขนม (LDPE/PP)</option>
                    <option value="แก้วพลาสติก/หลอด (PP/PS)">แก้วพลาสติก/หลอด (PP/PS)</option>
                    <option value="ขวดพลาสติกขุ่น (HDPE)">ขวดพลาสติกขุ่น (HDPE)</option>
                </select>
            </div>

            <!-- 4. คอลัมน์ E: น้ำหนัก (กิโลกรัม) -->
            <div class="form-group">
                <label class="form-label">⚖️ น้ำหนักขยะ (กิโลกรัม)</label>
                <input type="number" id="weight" class="form-input" step="0.01" min="0.01" placeholder="เช่น 1.25" required oninput="calculateCarbon()">
            </div>

            <!-- 5. คอลัมน์ G: ปริมาณ Carbon (kgCO2e) -->
            <div class="form-group">
                <label class="form-label">📉 ปริมาณคาร์บอนที่ลดได้ (kgCO2e)</label>
                <input type="number" id="carbonAmount" class="form-input readonly-input" step="0.001" readonly placeholder="ระบบคำนวณให้อัตโนมัติ">
            </div>

            <!-- 6. คอลัมน์ F: ลิงก์รูปภาพ (ช่องเลือกไฟล์ถ่ายรูป) -->
            <div class="form-group">
                <label class="form-label">📸 ถ่ายรูปภาพขยะแนบเข้าระบบ</label>
                <input type="file" id="imageFile" class="form-input" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">🚀 บันทึกข้อมูลขยะ</button>
        </form>
        <div id="statusReport" class="status-report">สถานะ: แสตนด์บาย รอการบันทึกข้อมูล...</div>
    </div>
</div>

<script>
    // 🎯 ใช้สคริปต์ท่อเดี่ยวตัวเดียวกับหน้า Register ที่ทำงานผ่านฉลุยเรียบร้อยแล้ว
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxMvlOCITbRiV_sPkHZtyO-X-l9sL03ZTy2I4lzaG-tVxauKJLcFO0ubb3ke8ZhA9lK/exec";
    const LIFF_TRASH_ID = "2010255862-LZnK22cW"; // ใช้ LIFF ID เดียวกันหรือเปลี่ยนตามระบบจริงได้เลยครับ
    let globalUserId = "MOCK_USER_TRASH_999";

    // เริ่มทำงานระบบดึงโปรไฟล์ LINE
    if (typeof liff !== 'undefined' && LIFF_TRASH_ID !== "") {
        liff.init({ liffId: LIFF_TRASH_ID })
            .then(async () => { 
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    if(profile && profile.userId) {
                        globalUserId = profile.userId; 
                        document.getElementById('lineUserId').value = globalUserId;
                    }
                }
            })
            .catch(err => {
                console.error("LIFF โหลดล้มเหลว", err);
                document.getElementById('lineUserId').value = globalUserId;
            });
    } else {
        document.getElementById('lineUserId').value = globalUserId;
    }

    // 📉 ฟังก์ชันคำนวณค่าคาร์บอนฟุตพริ้นท์โดยอ้างอิงตามค่าสากลเบื้องต้น
    function calculateCarbon() {
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const subType = document.getElementById('subType').value;
        let emissionFactor = 0;

        // อิงตามสูตรคำนวณการลดก๊าซเรือนกระจกเบื้องต้น (สามารถปรับตัวคูณได้ตามความต้องการครับ)
        if (subType === "ขวดพลาสติกใส (PET)") {
            emissionFactor = 2.15; 
        } else if (subType === "ถุงพลาสติก/ซองขนม (LDPE/PP)") {
            emissionFactor = 1.85;
        } else if (subType === "แก้วพลาสติก/หลอด (PP/PS)") {
            emissionFactor = 1.90;
        } else if (subType === "ขวดพลาสติกขุ่น (HDPE)") {
            emissionFactor = 2.05;
        }

        const carbonSaved = weight * emissionFactor;
        document.getElementById('carbonAmount').value = carbonSaved.toFixed(3);
    }

    // 🚀 ฟังก์ชันจัดรวมก้อนข้อมูลและแปลงภาพยิงตรงเข้าฐานข้อมูลกูเกิลชีท
    function submitTrashData() {
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusReport');
        const fileInput = document.getElementById('imageFile');

        if (fileInput.files.length === 0) {
            alert("⚠️ กรุณาถ่ายภาพหรือเลือกรูปภาพขยะก่อนกดบันทึกค่ะ");
            return;
        }

        btn.innerText = "⏳ กำลังส่งข้อมูลขยะและอัปโหลดภาพ...";
        btn.disabled = true;
        status.innerText = "กำลังแปลงไฟล์ภาพความละเอียดสูงและเชื่อมต่อเซิร์ฟเวอร์...";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            // แปลงก้อนไฟล์รูปภาพเป็น Base64
            const base64Data = e.target.result.split(',')[1];

            const formData = new FormData();
            formData.append("action", "trash"); // ส่ง Tag สับรางไปบอก Apps Script ว่าให้ลงแท็บบันทึกขยะ
            formData.append("lineUserId", globalUserId);
            formData.append("mainType", document.getElementById('mainType').value);
            formData.append("subType", document.getElementById('subType').value);
            formData.append("weight", document.getElementById('weight').value);
            formData.append("carbonAmount", document.getElementById('carbonAmount').value);
            formData.append("imageData", base64Data);
            formData.append("imageMimeType", file.type);

            // ยิงเข้าเซิร์ฟเวอร์ผ่านโหมดความปลอดภัยสูง
            fetch(scriptUrl, {
                method: "POST",
                mode: "no-cors", // ใช้รูปแบบ no-cors ให้ทะลวงผ่านการป้องกันบล็อกของเบราว์เซอร์มือถือ
                body: formData
            })
            .then(() => {
                status.innerHTML = "<span style='color:#143F24;'>🎉 บันทึกข้อมูลขยะและอัปโหลดรูปภาพลงแท็บสำเร็จเรียบร้อยแล้วค่ะ!</span>";
                document.getElementById('trashForm').reset();
                document.getElementById('lineUserId').value = globalUserId;
                btn.innerText = "🚀 บันทึกข้อมูลขยะ";
                btn.disabled = false;
                
                alert("🎉 บันทึกข้อมูลขยะและรูปถ่ายเข้าฐานข้อมูลบางกะเจ้าสำเร็จแล้วค่ะ!");
            })
            .catch(err => {
                console.error("Error:", err);
                status.innerHTML = "<span style='color:#red;'>❌ เกิดข้อผิดพลาดเครือข่าย กรุณาลองใหม่อีกครั้ง</span>";
                btn.innerText = "🚀 บันทึกข้อมูลขยะ";
                btn.disabled = false;
            });
        };

        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
