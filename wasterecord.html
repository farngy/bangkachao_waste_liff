<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกขยะดิจิทัล - บางกะเจ้า</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-dark: #143F24;     /* สีเขียวเข้มพรีเมียม */
            --text-main: #2d3748;        /* สีข้อความหลัก */
            --bg-light: #F4F6F5;         /* สีพื้นหลังกล่อง */
            --border-color: #E8ECE9;     /* สีเส้นขอบ */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            background: #FFFFFF;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .top-bar {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--bg-light);
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        h2 {
            font-size: 24px;
            color: var(--primary-dark);
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
            font-weight: 800;
        }

        /* 📱 ปุ่มการ์ดสี่เหลี่ยมตาม UI รูปภาพ */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 40px;
        }

        .choice-card {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: all 0.2s ease-in-out;
        }
        .choice-card:hover {
            border-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .choice-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .choice-card .label {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
        }

        /* ⚖️ หน้ากล่องระบุน้ำหนักขยะ */
        .weight-box {
            background: var(--bg-light);
            border: 2px solid var(--primary-dark);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .weight-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 38px;
            font-weight: 800;
            text-align: center;
            color: var(--primary-dark);
            outline: none;
        }

        .btn-quick-wrap {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .btn-quick {
            background: #ffffff;
            border: 1px solid #cbd5e0;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #4a5568;
        }

        /* 📸 อัปโหลดรูปสไตล์กรอบเส้นประพรีเมียม */
        .photo-upload-zone
