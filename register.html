<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 หน้าจอทดสอบระบบปิดหน้าต่าง LINE</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .test-box {
            background: white;
            padding: 35px 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h3 { color: #143F24; margin-top: 0; font-size: 22px; font-weight: 800; }
        p { color: #4a5568; font-size: 16px; margin-bottom: 30px; line-height: 1.5; }
        .btn-green {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 20px rgba(6,199,85,0.25);
            transition: all 0.2s;
        }
        .btn-green:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="test-box">
    <h3>🧪 หน้าจอทดสอบระบบ LIFF</h3>
    <p>พี่แฟงลองเอานิ้วจิ้มปุ่มสีเขียวด้านล่างนี้ดูครับ เพื่อทดสอบว่าหน้าจอจะม้วนปิดตัวเองแล้วเด้งกลับเข้าหน้าแชท LINE ปกติไหมครับ</p>
    
    <button type="button" class="btn-green" onclick="testCloseWindow()">
        💬 คลิกตรงนี้เพื่อทดลองปิดหน้าต่าง
    </button>
</div>

<script>
    const LIFF_REGISTER_ID = "2010255862-LZnK22cW";

    if (typeof liff !== 'undefined' && LIFF_REGISTER_ID !== "") {
        liff.init({ liffId: LIFF_REGISTER_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            })
            .catch(err => console.error("LIFF โหลดล้มเหลว", err));
    }

    // ฟังก์ชันสั่งปิดหน้าต่างเพียวๆ ไร้ลอจิกอื่นกวนใจ
    function testCloseWindow() {
        if (typeof liff !== 'undefined') {
            liff.closeWindow(); // สั่งทำลายหน้าต่างเว็บบนมือถือทันที
        } else {
            alert("กรุณาทดสอบผ่านแอป LINE ในมือถือเท่านั้นนะคะพี่แฟง");
        }
    }
</script>

</body>
</html>
