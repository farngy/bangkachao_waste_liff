<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST LINE TO GOOGLE SHEET</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; margin: 0; }
        .btn-test { background: #ff4757; color: white; border: none; padding: 30px 50px; font-size: 24px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 80%; max-width: 350px; }
        .btn-test:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <button class="btn-test" onclick="sendTestSignal()">🚨 กดทดสอบระบบตรงนี้เลยพี่แฟง</button>

<script>
    function sendTestSignal() {
        const btn = document.querySelector('.btn-test');
        btn.innerText = "⏳ กำลังยิงท่อข้อมูล...";
        btn.style.background = "#ffa502";

        // ลิงก์ Apps Script ของพี่แฟง
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzcEN_Dkv9EUfAIeCKHL7QxW61elqdimdCr7WJDtnb5hCVd4aeeA6y7gWgL7cUfKz_u/exec";

        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors" // เปิดโหมดทะลวงบล็อก Google บังคับให้ข้อมูลไหลเข้าแน่นอน
        })
        .then(() => {
            btn.innerText = "✅ ยิงท่อสำเร็จแล้ว!";
            btn.style.background = "#2ed573";
            alert("🎯 สัญญาณถูกส่งออกไปแล้ว! พี่แฟงแวะไปเปิดหน้าจอ Google Sheet ดูได้เลยครับว่ามีแถวใหม่โผล่มาไหม!");
        })
        .catch(err => {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
            btn.innerText = "🚨 กดทดสอบใหม่";
            btn.style.background = "#ff4757";
        });
    }
</script>
</body>
</html>
