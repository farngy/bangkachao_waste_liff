<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนอาสาสมัคร - บัญชีขยะดิจิทัล</title>

    <style>
        :root {
            --primary-dark: #143F24;     /* สีเขียวเข้มพรีเมียมจากรูป NIA */
            --primary-green: #1b4332;    /* สีเขียวแบรนด์หลัก */
            --accent-gold: #b3925c;      /* สีทองทรายหรูหราเพิ่มมิติ */
            --bg-light: #F4F6F5;         /* สีพื้นหลังขาวครีมสดชื่น */
            --text-main: #2d3748;        /* สีตัวหนังสือหลัก */
            --card-border: #E8ECE9;      /* สีขอบ */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* กล่องจำลองหน้าจอมือถือ */
        .phone-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background: #FFFFFF;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        /* Top Bar สไตล์หรูหรา */
        .top-bar {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--bg-light);
            margin-bottom: 25px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 26px;
            color: var(--primary-dark);
            margin: 0 0 10px 0;
            font-weight: 800;
            text-align: center;
        }
        .sub-title {
            font-size: 15px;
            color: #718096;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 17px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        /* ช่องกรอกข้อความสไตล์โมเดิร์นคลีน */
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid #cbd5e0;
            border-radius: 14px;
            color: var(--text-main);
            background-color: var(--bg-light);
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary-dark);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(20, 63, 36, 0.08);
        }
