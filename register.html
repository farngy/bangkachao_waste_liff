<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เทสระบบเชื่อมต่อ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 30px; text-align: center; background: #f4f6f5; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
        button { background: #143F24; color: white; border: none; width: 100%; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>🧪 ทดสอบท่อเชื่อมต่อ LIFF</h2>
    <p>กรอกชื่อแล้วกดปุ่มเพื่อดูว่าข้อมูลวิ่งเข้า Sheet ไหม</p>
    
    <input type="text" id="txtName" placeholder="พิมพ์ชื่อทดสอบที่นี่">
    <input type="tel" id="txtPhone" placeholder="พิมพ์เบอร์โทรทดสอบที่นี่">
    
    <button onclick="sendTest()">⚡ ส่งข้อมูลเข้า Google Sheet</button>
</div>

<script>
    // 🔗 1. เอาลิงก์ Web App URL ที่ได้จากขั้นที่ 2 มาแปะแทนที่ในเครื่องหมายคำพูดนี้ครับ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYpashQVDeva0koyTDw89r3lbB5HAPAnpk9dwLfvqdFedGKn6eVtbptJnUGFaN5I0/exec";
    
    // 🔗 2. เอาเลข LIFF ID หน้าลงทะเบียนของพี่มาแปะใส่ตรงนี้ครับ
    const LIFF_ID = "2010255862-LZnK22cW"; 

    let globalUserId = "MOCK_LINE_ID_Mมือถือ";

    // สั่งโหลดระบบดึงรหัส LINE ID ของแท้จากมือถือ
    if (LIFF_ID !== "") {
        liff.init({ liffId: LIFF_ID }).then(async () => {
            if (!liff.isLoggedIn()) { liff.login(); } else {
                const profile = await liff.getProfile();
                if(profile && profile.userId) { globalUserId = profile.userId; }
            }
        }).catch(err => console.error(err));
    }

    function sendTest() {
        const name = document.getElementById('txtName').value;
        const phone = document.getElementById('txtPhone').value;
        if(!name) { alert("กรุณาพิมพ์ชื่อก่อนครับพี่แฟง"); return; }

        alert("⏳ กำลังยิงข้อมูลข้ามค่าย... กด OK แล้วรอสลับดูหน้า Google Sheet ได้เลยครับ!");

        // ท่าส่งข้อมูลตรงดิบๆ ผ่าน URLSearchParams เข้าหากูเกิลชีท
        const params = new URLSearchParams();
        params.append('userId', globalUserId);
        params.append('fullname', name);
        params.append('phone', phone);

        fetch(SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });
    }
</script>
</body>
</html>
