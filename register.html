<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนสมาชิก - บางกะเจ้า</title>
    <style>
        body { font-family: sans-serif; background-color: #f7fafc; padding: 20px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { color: #2b6cb0; text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 14px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input[type="text"], input[type="tel"], select { width: 100%; padding: 10px; border: 1px solid #edf2f7; border-radius: 6px; box-sizing: border-box; background: #f7fafc; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn-submit { background-color: #2b6cb0; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 ฟอร์มลงทะเบียนสมาชิก</h2>
    <form id="regForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label>LINE User ID</label>
            <input type="text" id="lineUserId" placeholder="ระบุ LINE User ID (ถ้ามี)">
        </div>
        <div class="form-group">
            <label>ชื่อ - นามสกุล</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>เบอร์ติดต่อ</label>
            <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
            <label>ประเภทผู้ใช้งาน</label>
            <select id="userType" required>
                <option value="ประชาชนทั่วไป">ประชาชนทั่วไป</option>
                <option value="นักท่องเที่ยว">นักท่องเที่ยว</option>
                <option value="ผู้ประกอบการ/ร้านค้า">ผู้ประกอบการ/ร้านค้า</option>
                <option value="เจ้าหน้าที่ชุมชน">เจ้าหน้าที่ชุมชน</option>
            </select>
        </div>
        <div class="form-group">
            <label>ตำบล</label>
            <select id="subdistrict" required>
                <option value="ทรงคนอง">ทรงคนอง</option>
                <option value="บางกระสอบ">บางกระสอบ</option>
                <option value="บางกอบัว">...บางกอบัว</option>
                <option value="บางน้ำผึ้ง">บางน้ำผึ้ง</option>
                <option value="บางยอ">บางยอ</option>
                <option value="บางกระเจ้า">บางกระเจ้า</option>
            </select>
        </div>
        <div class="row">
            <div class="form-group">
                <label>หมู่ที่</label>
                <input type="text" id="villageNo">
            </div>
            <div class="form-group">
                <label>บ้านเลขที่</label>
                <input type="text" id="houseNo">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>เพศ</label>
                <select id="gender">
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
                    <option value="ไม่ระบุ">ไม่ระบุ</option>
                </select>
            </div>
            <div class="form-group">
                <label>ช่วงอายุ</label>
                <select id="ageRange">
                    <option value="ต่ำกว่า 20 ปี">ต่ำกว่า 20 ปี</option>
                    <option value="20-39 ปี">20-39 ปี</option>
                    <option value="40-59 ปี">40-59 ปี</option>
                    <option value="60 ปีขึ้นไป">60 ปีขึ้นไป</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>อาชีพ</label>
            <input type="text" id="occupation">
        </div>
        <div class="form-group" style="display:flex; gap:8px; align-items:center;">
            <input type="checkbox" id="pdpaConsent" value="ยินยอม" checked>
            <label for="pdpaConsent" style="margin:0; font-size:13px;">ยินยอมตามหลักเกณฑ์ PDPA</label>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">ส่งข้อมูลลงทะเบียน 🚀</button>
    </form>
    <div id="status">สถานะ: แสตนด์บาย</div>
</div>

<script>
    const WEB_APP_URL = "ลิงก์_WEB_APP_URL_ที่ได้จาก_APPS_SCRIPT";

    function submitForm(event) {
        event.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        status.innerText = "⏳ กำลังบันทึกข้อมูล...";

        const formData = new FormData();
        formData.append("action", "register");
        formData.append("lineUserId", document.getElementById('lineUserId').value);
        formData.append("name", document.getElementById('name').value);
        formData.append("phone", document.getElementById('phone').value);
        formData.append("userType", document.getElementById('userType').value);
        formData.append("subdistrict", document.getElementById('subdistrict').value);
        formData.append("villageNo", document.getElementById('villageNo').value);
        formData.append("houseNo", document.getElementById('houseNo').value);
        formData.append("gender", document.getElementById('gender').value);
        formData.append("ageRange", document.getElementById('ageRange').value);
        formData.append("occupation", document.getElementById('occupation').value);
        formData.append("pdpaConsent", document.getElementById('pdpaConsent').checked ? "ยินยอม" : "ไม่ยินยอม");

        fetch(WEB_APP_URL, { method: "POST", body: formData })
        .then(res => res.json())
        .then(data => {
            status.innerText = data.message;
            if(data.status === "success") document.getElementById('regForm').reset();
            btn.disabled = false;
        }).catch(err => {
            status.innerText = "❌ เกิดข้อผิดพลาดเครือข่าย";
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
