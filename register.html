<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปุ่มกดเทส โอเค</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f5; margin: 0; }
        button { background: #143F24; color: white; border: none; padding: 25px 50px; font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 80%; max-width: 300px; }
    </style>
</head>
<body>

    <button onclick="pressOK()">⚡ กดปุ่มส่งคำว่า โอเค</button>

<script>
    // 🔗 แปะลิงก์ /exec ตัวล่าสุดของพี่แฟงที่คัดลอกมาจากสเต็ปที่ 2 วางสวมในเครื่องหมายคำพูดนี้แทนเลยครับพี่!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzv3E2rOc66DikVe3k3ncR1AxFUbQYe3kcu-Q7PT-9ozOjR7aeX6hbcGhV3mVl5VGEJ/exec";

    function pressOK() {
        alert("⏳ กำลังยิงข้อมูลข้ามค่าย... กด OK แล้วสลับไปดูที่หน้า Google Sheet ได้เลยครับพี่แฟง!");
        fetch(SCRIPT_URL, { method: "GET", mode: "no-cors" });
    }
</script>
</body>
</html>
